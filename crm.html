<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivex CRM Dashboard</title>
    <!-- Fonts to match Kivex Theme -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="crm.css">
</head>
<body>

    <!-- CRM Login Screen -->
    <div id="loginScreen" class="screen">
        <div class="login-box">
            <h1 class="logo">KIVEX</h1>
            <p>Admin CRM Portal</p>
            <div class="input-group">
                <input type="password" id="adminPassword" placeholder="Enter Admin Password">
            </div>
            <button id="loginBtn" class="btn">Login</button>
            <p id="loginError" class="error-text hidden">Incorrect password or server error.</p>
        </div>
    </div>

    <!-- CRM Dashboard Screen (Hidden by default) -->
    <div id="dashboardScreen" class="screen hidden">
        <header class="crm-header">
            <div class="header-left">
                <h2 class="logo-small">KIVEX <span class="tag">CRM</span></h2>
            </div>
            <div class="header-right">
                <span id="backendStatus" class="status-badge checking">Checking connection...</span>
                <button id="logoutBtn" class="btn-outline">Logout</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="stats-row">
                <div class="stat-card">
                    <h3>Total Leads</h3>
                    <p id="totalLeadsCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>Recent Activity</h3>
                    <p>Within last 7 days</p>
                </div>
            </div>

            <div class="leads-section">
                <div class="section-header">
                    <h3>Contact Submissions</h3>
                    <button id="refreshBtn" class="btn-icon">↻ Refresh</button>
                </div>

                <div class="table-container">
                    <table id="leadsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Project Type</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody id="leadsBody">
                            <!-- Leads will be injected here via JS -->
                        </tbody>
                    </table>
                    <div id="loadingLeads" class="loading-state">Loading leads...</div>
                    <div id="noLeads" class="hidden empty-state">No leads found.</div>
                </div>
            </div>
        </main>
    </div>

    <script src="crm.js"></script>
</body>
</html>
